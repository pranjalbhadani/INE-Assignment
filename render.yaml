services:
  - type: web
    name: ine-price-tracker-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SCRAPE_TIMEOUT_MS
        value: 600000
      - key: SCRAPE_LOCK_TTL_MS
        value: 900000
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
